<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kai Horstmann — Links</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f7f7f5;
        --text: #111111;
        --muted: #6b6b6b;
        --line: #e0e0dc;
        --hover-bg: #ffffff;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141414;
          --text: #ebebeb;
          --muted: #888888;
          --line: #2a2a2a;
          --hover-bg: #1e1e1e;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "DM Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 48px 20px;
      }

      .container {
        width: 100%;
        max-width: 480px;
      }

      .profile {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 24px;
      }

      .avatar {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        object-fit: cover;
        flex-shrink: 0;
      }

      .profile-name {
        font-size: 1.1rem;
        font-weight: 500;
      }

      .links {
        display: grid;
        gap: 8px;
      }

      .link {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 18px;
        border: 1px solid var(--line);
        border-radius: 12px;
        color: var(--text);
        text-decoration: none;
        background: transparent;
        transition: background 0.15s ease, border-color 0.15s ease;
      }

      .link:hover,
      .link:focus-visible {
        background: var(--hover-bg);
        border-color: var(--muted);
        outline: none;
      }

      .link-title {
        font-size: 0.97rem;
        font-weight: 500;
        line-height: 1.35;
      }

      .arrow {
        flex-shrink: 0;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main class="container">
      <div class="profile">
        <img class="avatar" src="img/Kai-Horstmann_250210_Businessportraits0357.jpg" alt="Kai Horstmann" />
        <span class="profile-name">Kai T. Horstmann</span>
      </div>

      <div class="links">
        <a
          class="link"
          href="https://www.uni-siegen.de/department-psychologie/pddp"
          target="_blank"
          rel="noreferrer"
        >
          <span class="link-title">Psychologische Diagnostik und Differentielle Psychologie | Universität Siegen</span>
          <svg class="arrow" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M3 13L13 3M13 3H6M13 3V10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>

        <a
          class="link"
          href="https://www.uni-siegen.de/person/kai-horstmann"
          target="_blank"
          rel="noreferrer"
        >
          <span class="link-title">Website Universität Siegen</span>
          <svg class="arrow" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M3 13L13 3M13 3H6M13 3V10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>

        <a
          class="link"
          href="http://tinyurl.com/kthscholar"
          target="_blank"
          rel="noreferrer"
        >
          <span class="link-title">Google Scholar</span>
          <svg class="arrow" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M3 13L13 3M13 3H6M13 3V10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>

        <a
          class="link"
          href="https://github.com/kthorstmann"
          target="_blank"
          rel="noreferrer"
        >
          <span class="link-title">GitHub</span>
          <svg class="arrow" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M3 13L13 3M13 3H6M13 3V10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>

        <a
          class="link"
          href="http://osf.io/nk9xg"
          target="_blank"
          rel="noreferrer"
        >
          <span class="link-title">Open Science Framework</span>
          <svg class="arrow" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M3 13L13 3M13 3H6M13 3V10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>

        <a
          class="link"
          href="https://orcid.org/0000-0003-3224-1880"
          target="_blank"
          rel="noreferrer"
        >
          <span class="link-title">ORCID</span>
          <svg class="arrow" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M3 13L13 3M13 3H6M13 3V10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>

        <a
          class="link"
          href="http://www.researcherid.com/rid/U-5203-2018"
          target="_blank"
          rel="noreferrer"
        >
          <span class="link-title">ResearcherID</span>
          <svg class="arrow" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M3 13L13 3M13 3H6M13 3V10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
        
        <a
          class="link"
          href="https://www.linkedin.com/in/kai-t-horstmann/"
          target="_blank"
          rel="noreferrer"
        >
          <span class="link-title">LinkedIn</span>
          <svg class="arrow" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M3 13L13 3M13 3H6M13 3V10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </div>
    </main>
  </body>
</html>
